<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Page is already dark: tells MIUI/Chrome "force dark" not to recolor it -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1d2a">
<title>Kumple: Łap co Twoje</title>
<style>
  :root { color-scheme:dark; --bg:#1b1d2a; --panel:#262a3d; --text:#f3f3f7; --accent:#ffcc33; --bad:#ff5c5c; --good:#5cff8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,Segoe UI,sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  h1 { margin:16px 0 4px; font-size:28px; }
  .sub { opacity:.7; margin-bottom:12px; text-align:center; padding:0 16px; }
  #menu, #end { display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; max-width:900px; width:100%; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; width:100%; }
  .card { background:var(--panel); border:2px solid transparent; border-radius:14px; padding:14px; cursor:pointer; transition:transform .1s,border-color .1s; }
  .card:hover { transform:translateY(-3px); border-color:var(--accent); }
  .card .face { font-size:42px; }
  .card h3 { margin:6px 0 4px; }
  .card p { margin:0; font-size:14px; opacity:.8; }
  .card .items { margin-top:8px; font-size:14px; }
  #game { display:none; position:relative; align-items:center; padding:8px; width:100%; }
  canvas { background:#87b8e8; border-radius:14px; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  #hud { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:4px 2px 8px; font-size:18px; font-weight:600; white-space:nowrap; }
  #hud #mute { position:static; padding:4px 8px; font-size:16px; }
  #end { display:none; text-align:center; }
  #end .big { font-size:64px; }
  #end h2 { margin:0; color:var(--accent); }
  button { background:var(--accent); color:#222; border:0; border-radius:10px; padding:12px 22px; font-size:17px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:2px solid var(--text); }
  .hint { font-size:13px; opacity:.6; }
  #mute { position:fixed; top:10px; right:10px; padding:8px 12px; font-size:20px; background:var(--panel); color:var(--text); z-index:10; }
  .board { background:var(--panel); border-radius:14px; padding:12px 16px; width:100%; max-width:460px; }
  .board h3 { margin:0 0 8px; text-align:center; }
  .board ol { margin:0; padding-left:28px; }
  .board li { padding:4px 0; display:flex; justify-content:space-between; gap:8px; }
  .board li.me { color:var(--accent); font-weight:700; }
  .board .empty { text-align:center; opacity:.6; font-size:14px; }
  .save { display:flex; gap:8px; width:100%; max-width:460px; }
  .save input { flex:1; min-width:0; padding:12px; border-radius:10px; border:2px solid var(--panel); background:#11131c; color:var(--text); font-size:16px; }
  body.playing h1, body.playing .sub { display:none; }
  /* No pull-to-refresh or page bounce while dragging the player */
  html, body { overscroll-behavior:none; }
  body.playing { overflow:hidden; position:fixed; inset:0; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  @media (max-width:600px) {
    h1 { font-size:19px; margin-top:14px; padding:0 50px; text-align:center; }
    #hud { font-size:14px; gap:4px; }
    #menu, #end { padding:12px; }
    .sub { margin-top:12px; }
    .grid { grid-template-columns:1fr 1fr; gap:8px; }
    .card { padding:10px; }
    .card .face { font-size:32px; }
    .card p, .card .items { font-size:12px; }
  }
</style>
</head>
<body>
<button id="mute" title="Dźwięk">🔊</button>
<h1>🍻 Kumple: Łap co Twoje</h1>
<div class="sub">Wybierz kumpla, łap dobre rzeczy, unikaj złych. Świecące to niespodzianki! 3 życia, 45 sekund.</div>

<div id="menu">
  <div class="grid" id="cards"></div>
  <div class="hint">Sterowanie: strzałki / A-D / myszka / przeciągnij palcem</div>
  <div class="board" id="menuBoard"></div>
</div>

<div id="game">
  <div id="hud"><span id="hName"></span><span id="hScore"></span><span id="hTime"></span><span id="hLives"></span></div>
  <canvas id="c" width="600" height="600"></canvas>
</div>

<div id="end">
  <div class="big" id="eFace"></div>
  <h2 id="eTitle"></h2>
  <div id="eBadge" style="color:#ff8ec7;font-weight:700"></div>
  <div id="eScore" style="font-size:20px"></div>
  <div id="eText" style="max-width:500px;opacity:.85"></div>
  <form class="save" id="saveForm">
    <input id="playerName" maxlength="16" placeholder="Twoje imię" autocomplete="off">
    <button type="submit">Zapisz</button>
  </form>
  <div class="buttons">
    <button id="again">Jeszcze raz</button>
    <button class="ghost" id="back">Zmień kumpla</button>
  </div>
  <button class="ghost" id="share">📣 Pochwal się</button>
  <div class="board" id="endBoard"></div>
</div>

const EMOJI_FONT = "\"Apple Color Emoji\", \"Segoe UI Emoji\", \"Noto Color Emoji\", sans-serif";

const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
const GAME_TIME = 45;

// ---------- Sound (Web Audio, no files) ----------
let audio = null;
let muted = false;
try { muted = localStorage.getItem("kumple_muted") === "1"; } catch {}
$("mute").textContent = muted ? "🔇" : "🔊";
$("mute").onclick = () => {
  muted = !muted;
  $("mute").textContent = muted ? "🔇" : "🔊";
  try { localStorage.setItem("kumple_muted", muted ? "1" : "0"); } catch {}
};

function tone(freq, dur, { type = "square", vol = 0.12, slide = 0, delay = 0 } = {}) {
  if (muted) return;
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t); osc.stop(t + dur);
}

const sfx = {
  start: () => [523, 659, 784].forEach((f, i) => tone(f, 0.12, { delay: i * 0.09 })),
  catch: () => tone(700 + Math.random() * 300, 0.1, { slide: 400, vol: 0.08 }),
  hit:   () => { tone(180, 0.35, { type: "sawtooth", slide: -120, vol: 0.18 }); tone(90, 0.3, { type: "square", vol: 0.1 }); },
  night: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, { type: "triangle", delay: i * 0.15, vol: 0.15 })),
  quip:  () => tone(1200, 0.05, { type: "sine", vol: 0.05 }),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, { delay: i * 0.12, type: "triangle", vol: 0.15 })),

// ---------- Leaderboard (localStorage) ----------
const LB_KEY = "kumple_leaderboard";
function loadBoard() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; }
}
function saveBoard(list) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch {}
}
function renderBoard(el, highlightId) {
  const list = loadBoard();
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  el.innerHTML = "<h3>🏆 Tabela wyników</h3>" + (list.length
    ? "<ol>" + list.map(r => {
        const c = CHARS.find(x => x.id === r.char);
        return `<li class="${r.id === highlightId ? "me" : ""}"><span>${esc(r.name)} ${c ? c.face : ""}</span><span>${r.score} pkt</span></li>`;
      }).join("") + "</ol>"
    : '<div class="empty">Pusto. Zagraj i bądź pierwszy!</div>');
}

// ---------- Responsive canvas ----------
function fitCanvas() {
  const hudH = $("hud").offsetHeight || 40;
  // Game units = CSS pixels, so emoji and text keep a readable size on phones
  W = Math.floor(Math.min(window.innerWidth - 16, 600));
  H = Math.floor(Math.max(260, Math.min(window.innerHeight - hudH - 20, W * 2.2)));
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  $("hud").style.width = W + "px";
  if (player) {
    player.y = H - 55;
    player.speed = W * 0.9;
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  }
}
addEventListener("resize", () => { if (running) fitCanvas(); });

  const goods = (c.good.concat(c.goodNight || [])).map(g => g[0]).join(" ");

  el.innerHTML = `<div class="face">${c.face}</div><h3>${c.name}</h3><p>${c.desc}</p>
    <div class="items">✅ ${goods}<br>❌ ${bads}</div>`;
  el.onclick = () => start(c);
  $("cards").appendChild(el);
}

function show(id) {
  for (const s of ["menu", "game", "end"]) $(s).style.display = s === id ? "flex" : "none";
  if (id === "game") $("game").style.flexDirection = "column";
  document.body.classList.toggle("playing", id === "game");
  if (id !== "game") document.body.prepend($("mute"));
  if (id === "menu") renderBoard($("menuBoard"));
  scrollTo(0, 0);
}

function start(c) {
  ch = c;
  items = []; popups = [];
  score = 0; lives = 3; timeLeft = GAME_TIME; spawnT = 0; quipT = 3; quip = null; shake = 0;
  effects = { double: 0, slow: 0, wide: 0, shield: false }; banner = null;
  combo = 0; bestCombo = 0; visit = null; visitT = 9 + Math.random() * 4;
  lectured = 0; mateuszVisited = c.id === "mateusz";
  $("hName").textContent = `${c.face} ${c.name}`;
  $("hScore").textContent = "Punkty: 0";
  $("hTime").textContent = `⏱ ${GAME_TIME}s`;
  $("hLives").textContent = "❤️❤️❤️";
  $("hud").appendChild($("mute"));
  show("game");
  player = { x: 0, y: 0, w: 64, speed: 420 };
  fitCanvas();
  player.x = W / 2;
  running = true; last = performance.now();
  sfx.start();
  requestAnimationFrame(loop);
}

const isNight = () => ch.night && timeLeft < GAME_TIME / 2;

function spawn() {
  const night = isNight();
  const goodPool = night ? ch.goodNight : ch.good;
  const badPool = night ? ch.badNight : ch.bad;
  const difficulty = 1 - timeLeft / GAME_TIME; // 0 -> 1
  // Speed relative to board height, so tall phone boards don't feel slow
  const vy = H * (0.25 + Math.random() * 0.13 + difficulty * 0.37);
  const x = 30 + Math.random() * (W - 60);
  if (ch.boosts && Math.random() < BOOST_CHANCE) {
    const [emoji, label, type, value] = ch.boosts[Math.floor(Math.random() * ch.boosts.length)];
    items.push({ x, y: -30, vy: vy * 0.8, emoji, label, boost: { type, value }, rot: 0, vr: 0 });
    return;
  }
  const isBad = Math.random() < 0.3 + difficulty * 0.2;
  const pool = isBad ? badPool : goodPool;
  const [emoji, label] = pool[Math.floor(Math.random() * pool.length)];
  items.push({
    x, y: -30, vy,
    emoji, label, bad: isBad, rot: Math.random() * 6, vr: (Math.random() - .5) * 4,
  });
}

// Every 5 catches in a row adds +1 to the multiplier, capped at x4
const comboMult = () => Math.min(4, 1 + Math.floor(combo / 5));

function applyBoost(it) {
  const { type, value } = it.boost;
  if (type === "double" || type === "slow" || type === "wide") effects[type] = BOOST_TIME;
  if (type === "life") lives = Math.min(MAX_LIVES, lives + 1);
  if (type === "shield") effects.shield = true;
  if (type === "points") score += value;
  banner = { emoji: it.emoji, text: it.label, t: 2.2 };
  sfx.boost();
  if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
}

function startVisit() {
  const others = CHARS.filter(c => c.id !== ch.id);
  // Mateusz always drops in once per game to lecture about Tokarczuk
  const who = mateuszVisited ? others[Math.floor(Math.random() * others.length)] : CHARS.find(c => c.id === "mateusz");
  if (who.id === "mateusz") mateuszVisited = true;
  const def = VISIT_OVERRIDES[`${ch.id}>${who.id}`] || VISITS[who.id];
  const fromLeft = Math.random() < 0.5;
  visit = { who, def, x: fromLeft ? -40 : W + 40, dir: fromLeft ? 1 : -1, dropT: 0.3, drops: def.kind === "good" ? 8 : 5 };
  banner = { emoji: who.face, text: def.text, t: 2 };
  def.kind === "good" ? sfx.boost() : sfx.hit();
}

function updateVisit(dt) {
  if (!visit) {
    visitT -= dt;
    if (visitT <= 0 && timeLeft > 4) startVisit();
    return;
  }
  // Cross the board in ~2.6s, dropping items along the way
  visit.x += visit.dir * (W + 80) / 2.6 * dt;
  visit.dropT -= dt;
  const bad = visit.def.kind === "bad", lecture = visit.def.kind === "lecture";
  if (visit.dropT <= 0 && visit.drops > 0 && visit.x > 20 && visit.x < W - 20) {
    visit.drops--;
    visit.dropT = 2.2 / (visit.def.kind === "good" ? 8 : 5);
    items.push({ x: visit.x, y: 90, vy: H * 0.32, emoji: visit.def.emoji,
      label: bad ? `Od: ${visit.who.name}` : `Prezent od: ${visit.who.name}`, bad, lecture, rot: 0, vr: (Math.random() - .5) * 6 });
  }
  if (visit.x < -60 || visit.x > W + 60) { visit = null; visitT = 11 + Math.random() * 5; }
}

function addPopup(text, x, y, color) {
  popups.push({ text, x, y, color, t: 1 });
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  const wasNight = isNight();
  timeLeft -= dt;
  if (!wasNight && isNight()) { addPopup("🌙 NOCNA ZMIANA NA SŁOWACJI!", W / 2, H / 2, "#ffcc33"); sfx.night(); }

  if (keys.left) player.x -= player.speed * dt;
  if (keys.right) player.x += player.speed * dt;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  spawnT -= dt;
  if (spawnT <= 0) {
    spawn();
    spawnT = Math.max(0.3, 0.8 - (1 - timeLeft / GAME_TIME) * 0.5);
  }

  updateVisit(dt);
  for (const k of ["double", "slow", "wide"]) effects[k] = Math.max(0, effects[k] - dt);
  player.w = effects.wide > 0 ? 130 : 64;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  const fall = effects.slow > 0 ? 0.45 : 1;

  for (const it of items) {
    it.y += it.vy * dt * fall;
    it.rot += it.vr * dt;
    if (!it.dead && it.y > player.y - 30 && it.y < player.y + 20 && Math.abs(it.x - player.x) < player.w / 2 + 15) {
      it.dead = true;
      if (it.boost) {
        applyBoost(it);
      } else if (it.lecture) {
        lectured++;
        score -= LECTURE_PENALTY;
        addPopup(`-${LECTURE_PENALTY} ${LECTURE_LINES[Math.floor(Math.random() * LECTURE_LINES.length)]}`, it.x, it.y, "#c2255c");
        sfx.quip();
      } else if (it.bad && effects.shield) {
        effects.shield = false;
        addPopup("🛡️ Uff, tarcza!", it.x, it.y, "#3b6fd8");
        sfx.shield();
      } else if (it.bad) {
        lives--;
        if (combo >= 5) addPopup(`Kombo przerwane (${combo})`, W / 2, H * 0.55, "#ff5c5c");
        combo = 0;
        addPopup(`${it.label} 💥`, it.x, it.y, "#ff5c5c");
        shake = 0.3;
        sfx.hit();
        if (navigator.vibrate) navigator.vibrate(120);
      } else {
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        const pts = 10 * comboMult() * (effects.double > 0 ? 2 : 1);
        score += pts;
        if (COMBO_SHOUTS[combo]) {
          addPopup(`🔥 KOMBO ${combo}! ${COMBO_SHOUTS[combo]}`, W / 2, H * 0.3, "#e8590c");
          sfx.combo();
        }
        addPopup(`+${pts} ${it.label}`, it.x, it.y, "#2a8f45");
        sfx.catch();
      }
    }
  }
  items = items.filter(it => !it.dead && it.y < H + 40);

  for (const p of popups) { p.t -= dt * 0.8; p.y -= 40 * dt; }
  popups = popups.filter(p => p.t > 0);

  quipT -= dt;
  if (quipT <= 0) {
    quip = { text: ch.quips[Math.floor(Math.random() * ch.quips.length)], t: 2.5 };
    quipT = 5 + Math.random() * 3;
    sfx.quip();
  }
  if (quip) { quip.t -= dt; if (quip.t <= 0) quip = null; }
  if (shake > 0) shake -= dt;

  $("hScore").textContent = `Punkty: ${score}`;
  $("hTime").textContent = `⏱ ${Math.max(0, Math.ceil(timeLeft))}s`;
  // Compact form above 3 lives so the HUD fits on narrow phones
  $("hLives").textContent = lives > 3 ? `❤️×${lives}` : "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(Math.max(0, 3 - lives));

  if (lives <= 0 || timeLeft <= 0) end(lives <= 0);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 12, (Math.random() - .5) * 12);
  ctx.fillStyle = isNight() ? ch.night : ch.sky;
  ctx.fillRect(-10, -10, W + 20, H + 20);
  if (isNight()) { ctx.font = "40px " + EMOJI_FONT; ctx.fillText("🌙", W - 50, 40); }

  // ground
  ctx.fillStyle = isNight() ? "#2c3a2c" : "#6b9b4a";
  ctx.fillRect(-10, H - 20, W + 20, 30);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const it of items) {
    ctx.save();
    ctx.translate(it.x, it.y); ctx.rotate(it.rot * 0.3);
    if (it.boost) {
      // Pulsing golden glow so boosts stand out
      const pulse = 26 + Math.sin(performance.now() / 120) * 5;
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, pulse);
      g.addColorStop(0, "rgba(255,230,80,0.95)"); g.addColorStop(1, "rgba(255,200,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.font = "38px " + EMOJI_FONT;
    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  }

  if (visit) {
    ctx.font = "44px " + EMOJI_FONT;
    ctx.fillText(visit.who.face, visit.x, 78);
    ctx.font = "bold 13px system-ui";
    ctx.fillStyle = isNight() ? "#fff" : "#222";
    ctx.fillText(visit.who.name, visit.x, 108);
  }

  // player (wide boost shows the catch zone, shield shows a bubble)
  if (effects.wide > 0) {
    ctx.fillStyle = "rgba(255,204,51,0.45)";
    roundRect(player.x - player.w / 2, player.y + 14, player.w, 12, 6);
  }
  if (effects.shield) {
    ctx.strokeStyle = "rgba(59,111,216,0.8)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(player.x, player.y, 40, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.font = "56px " + EMOJI_FONT;
  ctx.fillText(ch.face, player.x, player.y);
  ctx.font = "bold 14px system-ui";
  ctx.fillStyle = isNight() ? "#fff" : "#222";
  ctx.fillText(ch.name, player.x, player.y + 34);

  // speech bubble
  if (quip) {
    ctx.font = "16px system-ui";
    const tw = ctx.measureText(quip.text).width + 20;
    const bx = Math.max(tw / 2 + 5, Math.min(W - tw / 2 - 5, player.x));
    ctx.fillStyle = "#fff";
    roundRect(bx - tw / 2, player.y - 85, tw, 30, 10);
    ctx.fillStyle = "#222";
    ctx.fillText(quip.text, bx, player.y - 70);
  }

  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.t);
    // Shrink long labels to fit narrow screens, then keep them inside the board
    let size = 20;
    ctx.font = `bold ${size}px system-ui`;
    const maxW = W - 16;
    let tw = ctx.measureText(p.text).width;
    if (tw > maxW) { size = Math.max(11, Math.floor(size * maxW / tw)); ctx.font = `bold ${size}px system-ui`; tw = ctx.measureText(p.text).width; }
    const px = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, p.x));
    ctx.lineWidth = 4; ctx.strokeStyle = "#fff";
    ctx.strokeText(p.text, px, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, px, p.y);
    ctx.globalAlpha = 1;
  }

  // active effects, top-left
  const tags = [];
  if (combo >= 5) tags.push(`🔥 x${comboMult()} (${combo})`);
  if (effects.double > 0) tags.push(`x2 ${Math.ceil(effects.double)}s`);
  if (effects.slow > 0) tags.push(`🐢 ${Math.ceil(effects.slow)}s`);
  if (effects.wide > 0) tags.push(`↔️ ${Math.ceil(effects.wide)}s`);
  if (effects.shield) tags.push("🛡️");
  ctx.font = "bold 16px system-ui"; ctx.textAlign = "left";
  tags.forEach((t, i) => {
    const tw = ctx.measureText(t).width + 16;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(8, 8 + i * 30, tw, 26, 8);
    ctx.fillStyle = "#ffcc33";
    ctx.fillText(t, 16, 21 + i * 30);
  });
  ctx.textAlign = "center";

  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t * 2);
    const by = H * 0.38;
    ctx.fillStyle = "rgba(20,20,40,0.8)";
    roundRect(12, by - 60, W - 24, 110, 16);
    ctx.font = "48px " + EMOJI_FONT;
    ctx.fillText(banner.emoji, W / 2, by - 22);
    let size = 22;
    ctx.font = `bold ${size}px system-ui`;
    const tw = ctx.measureText(banner.text).width;
    if (tw > W - 48) { size = Math.max(12, Math.floor(size * (W - 48) / tw)); ctx.font = `bold ${size}px system-ui`; }
    ctx.fillStyle = "#ffcc33";
    ctx.fillText(banner.text, W / 2, by + 26);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill();
}

function end(died) {
  running = false;
  const rank = score < 100 ? 0 : score < 250 ? 1 : score < 400 ? 2 : 3;
  $("eFace").textContent = ch.face;
  $("eTitle").textContent = ch.titles[rank];
  $("eBadge").textContent = lectured > 0
    ? `📚 + tytuł honorowy: Lewak Gry (wysłuchane wykłady o Tokarczuk: ${lectured})` : "";
  $("eScore").textContent = `Wynik: ${score} pkt` + (bestCombo >= 5 ? ` · najlepsze kombo: ${bestCombo}` : "");
  const deathLines = {
    sw: "Za dużo przerw. W Austrii by Cię zwolnili.",
    piotrek: "Fachowiec zniknął z zaliczką. Dom w Jabłonce poczeka.",
    marcin: "Sanepid zamknął Kabanos. Bracia się śmieją.",
    pawel: "Mateusz wygrał tę dyskusję. Do następnych świąt.",
    mateusz: "Paweł wygrał tę dyskusję. Do następnych świąt.",
    tomek: "Organizm w końcu upomniał się o sen.",
    dominik: "Produkcja leży. Piątek, 16:58. Klasyk.",
  };
  $("eText").textContent = died ? deathLines[ch.id] : "Przetrwałeś cały dzień. Szacun.";
  died ? sfx.lose() : sfx.win();
  lastResult = { char: ch.id, score, saved: false };
  $("saveForm").style.display = score > 0 ? "flex" : "none";
  try { $("playerName").value = localStorage.getItem("kumple_name") || ""; } catch {}
  renderBoard($("endBoard"));
  show("end");
}

let lastResult = null;
$("saveForm").onsubmit = e => {
  e.preventDefault();
  if (!lastResult || lastResult.saved) return;
  const name = $("playerName").value.trim() || "Anonim";
  try { localStorage.setItem("kumple_name", name); } catch {}
  const id = Date.now() + "" + Math.random();
  const list = loadBoard();
  list.push({ id, name, char: lastResult.char, score: lastResult.score });
  list.sort((a, b) => b.score - a.score);
  saveBoard(list.slice(0, 10));
  lastResult.saved = true;
  $("saveForm").style.display = "none";
  renderBoard($("endBoard"), id);
  sfx.catch();
};

$("share").onclick = async () => {
  const url = location.protocol.startsWith("http") ? location.href.split("#")[0] : "";
  const text = `🍻 Kumple: Łap co Twoje\n${ch.face} ${ch.name}: ${score} pkt, tytuł „${$("eTitle").textContent}”` +
    (bestCombo >= 5 ? `, kombo ${bestCombo}` : "") + (lectured > 0 ? " + 📚 Lewak Gry" : "") + "\nDasz radę lepiej?" + (url ? `\n${url}` : "");
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    $("share").textContent = "✅ Skopiowano, wklej na grupę!";
  } catch {
    // Share sheet cancelled or clipboard blocked: nothing to do
  }
  setTimeout(() => { $("share").textContent = "📣 Pochwal się"; }, 2500);
};

$("again").onclick = () => start(ch);
$("back").onclick = () => show("menu");

// Controls
addEventListener("keydown", e => {
  if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = true;
  if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = true;
});
addEventListener("keyup", e => {
  if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = false;
  if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = false;
});
function pointerMove(clientX) {
  const r = cv.getBoundingClientRect();
  player.x = (clientX - r.left) * (W / r.width);
}
cv.addEventListener("mousemove", e => running && pointerMove(e.clientX));
// Touch anywhere on the game screen (not just the canvas) moves the player
const onTouch = e => { if (running) { pointerMove(e.touches[0].clientX); e.preventDefault(); } };
$("game").addEventListener("touchstart", onTouch, { passive: false });
$("game").addEventListener("touchmove", onTouch, { passive: false });
</script>
